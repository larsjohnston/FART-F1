<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Donkey">
  <title>Donkey</title>
  <!-- Original cartoon donkey head. -->
  <!-- ears -->
  <ellipse cx="16" cy="11" rx="4" ry="9" transform="rotate(-16 16 11)" fill="#9aa0a6"/>
  <ellipse cx="32" cy="11" rx="4" ry="9" transform="rotate(16 32 11)" fill="#9aa0a6"/>
  <ellipse cx="16.5" cy="12" rx="1.8" ry="5.5" transform="rotate(-16 16.5 12)" fill="#c7ccd1"/>
  <ellipse cx="31.5" cy="12" rx="1.8" ry="5.5" transform="rotate(16 31.5 12)" fill="#c7ccd1"/>
  <!-- head -->
  <path d="M14 22 q10 -7 20 0 q4 3 2 11 q-2 9 -12 9 q-10 0 -12 -9 q-2 -8 2 -11 Z" fill="#9aa0a6"/>
  <!-- mane -->
  <path d="M22 15 q2 4 0 8 M26 15 q2 4 0 8" stroke="#6b7178" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="24" cy="34" rx="9" ry="7" fill="#d7dbdf"/>
  <ellipse cx="20" cy="34" rx="1.4" ry="2" fill="#4a4f55"/>
  <ellipse cx="28" cy="34" rx="1.4" ry="2" fill="#4a4f55"/>
  <!-- eyes -->
  <circle cx="19" cy="25" r="1.8" fill="#2b2f34"/>
  <circle cx="29" cy="25" r="1.8" fill="#2b2f34"/>
</svg>

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      # Lint is intentionally not gated yet: it has long-standing errors
      # (see CLAUDE.md "Tech / verifying changes"). Add `npx eslint` here once
      # those are cleaned up.
